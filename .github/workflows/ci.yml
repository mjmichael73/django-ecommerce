# Ensures collectstatic produces invoice PDF assets at STATIC_ROOT (see ecommerce/pdf_stylesheet.py).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  staticfiles:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: ecommerce.settings
      SECRET_KEY: ci-collectstatic-only-not-for-production
    defaults:
      run:
        working-directory: be/ecommerce
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: be/requirements.txt

      - name: Install WeasyPrint OS dependencies (match Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 \
            libffi-dev shared-mime-info

      - name: Install Python dependencies
        run: pip install -r ../requirements.txt

      - name: makemigrations check
        run: python manage.py makemigrations --check --no-input
        env:
          SECRET_KEY: ci-collectstatic-only-not-for-production
          POSTGRES_DB: ecommerce
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ci-build-placeholder-not-for-production

      - name: collectstatic
        run: python manage.py collectstatic --noinput

      - name: Invoice PDF stylesheet must exist in STATIC_ROOT
        run: test -f static/css/pdf.css

  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: ecommerce.settings
      SECRET_KEY: ci-test-secret-not-for-production-use-min-32ch
    defaults:
      run:
        working-directory: be/ecommerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: be/requirements.txt
      - name: Install WeasyPrint OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 \
            libffi-dev shared-mime-info
      - name: Install Python dependencies
        run: pip install -r ../requirements.txt
      - name: Django tests
        # NOTE: ``ecommerce.tests`` is a package label, so Django's DiscoverRunner
        # recursively loads every ``ecommerce/tests/test_*.py`` (this includes
        # test_k8s_manifests, whose validator runs in CI because the full checkout
        # is present — it only skips inside the app image where k8s/ is absent).
        # Do NOT append ``ecommerce.tests.test_k8s_manifests`` as a second label:
        # that would double-run the module.
        run: >-
          python manage.py test ecommerce.tests ecommerce.tests.sentry
          ecommerce.metrics.tests orders.tests payment.tests coupons.tests
          accounts.tests shop.tests returns.tests wishlist.tests -v2
        env:
          ECOMMERCE_DOCKER_DIR: ${{ github.workspace }}/docker

  # Container pipeline: the production image is BUILT on every PR and push (fast
  # feedback, catches broken Dockerfiles immediately) and PUBLISHED to GHCR only on
  # pushes to main. This job runs in PARALLEL with staticfiles/test on purpose — no
  # `needs:` — so tests gate the merge via branch protection rules, not via job
  # ordering here, and neither pipeline can mask the other's failure.
  docker:
    runs-on: ubuntu-latest
    # Least privilege: checkout needs contents:read; packages:write is exercised only
    # by the main-only publish step below.
    permissions:
      contents: read
      packages: write
    env:
      # Deterministic image name — without this, compose derives it from the checkout
      # directory name (e.g. "django-ecommerce-web").
      COMPOSE_PROJECT_NAME: ci
      # Placeholders for compose interpolation of the ${...:?} vars in service env
      # blocks (docker compose evaluates the whole file even for `build web`).
      # Never real secrets: CI does not run the built image.
      SECRET_KEY: ci-build-placeholder-not-for-production
      POSTGRES_PASSWORD: ci-build-placeholder-not-for-production
    steps:
      - uses: actions/checkout@v4

      - name: Compose file sanity check
        run: docker compose config --quiet

      - name: Validate Grafana dashboards / Prometheus provisioning
        # Runs the standalone validator (no Django needed) to catch broken
        # dashboard JSON or mis-provisioned YAML even if Django tests are skipped.
        run: python3 docker/grafana/scripts/validate_dashboards.py

      - name: Validate Kubernetes manifests
        # Mirrors the Grafana validator: a standalone, Django-free script that
        # parses every YAML under k8s/ with yaml.safe_load and asserts structural
        # invariants (kustomization refs, probe split, envFrom, command overrides,
        # resource limits). Vanilla python3 on the runner lacks pyyaml, so install
        # it first. This is the CI side of the validator; the manual gate is
        # `kubectl apply --dry-run=client -k k8s/overlays/prod` (see docs/kubernetes.md).
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/validate_k8s_manifests.py

      - name: Build production image (always)
        run: docker compose build web

      - name: Publish image to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash   # ${GITHUB_SHA::7} substring syntax is bash-specific
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}"
          docker tag ci-web "${IMAGE}:latest"
          docker tag ci-web "${IMAGE}:sha-${GITHUB_SHA::7}"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:sha-${GITHUB_SHA::7}"
