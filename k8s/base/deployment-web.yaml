# Web Deployment: Django app served by gunicorn behind the entrypoint.sh wrapper
# (DB wait + migrate --noinput + collectstatic unless SKIP_COLLECTSTATIC=1).
#
# Liveness/readiness split rationale (card a9cea652):
#   * readiness = httpGet /health/ (port 8000) — this view runs `SELECT 1`,
#     so it genuinely reflects DB reachability. The load balancer / ingress
#     pulls it to decide routing.
#   * liveness = tcpSocket 8000 — a non-DB check so a transient Postgres blip
#     does NOT trigger a pod restart (which would just add load back to a DB
#     that's already struggling). A hung gunicorn that stops accepting
#     connections is still caught by kubelet.
#   * There is NO /healthz in this repo; /health/ is the only health endpoint
#     (ecommerce/metrics/views.py, mounted in ecommerce/urls.py). See
#     docs/kubernetes.md for details.
#
# Migrations-per-boot concurrency is bounded by Postgres DDL locking + the
# transactional `django_migrations` table — see docs/migrations.md (the
# residual near-simultaneous boot race is documented as acceptable for this
# stack and bounded to a harmless "already applied" / rollback no-op).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-web
  labels:
    app: ecommerce-web
  # Migrate-concurrency contract is inherited from entrypoint.sh + the
  # transactional migration model — see docs/migrations.md ("Container
  # start-up ordering ... serializes conflicting ALTER TABLE").
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-web
  template:
    metadata:
      labels:
        app: ecommerce-web
    spec:
      # Web image only ships be/ecommerce (Dockerfile COPY). DJANGO_SETTINGS_MODULE
      # is baked into the image; all other config flows from envFrom below.
      containers:
        - name: web
          image: ghcr.io/mjmichael73/django-ecommerce:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ecommerce-config
            - secretRef:
                name: ecommerce-secrets
          # Entrypoint runs migrate + collectstatic (see Dockerfile); gunicorn is the CMD.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
            successThreshold: 1
          # Media uploads (user content) are NOT in the image — pods that render
          # user media need a shared store. Mount an object-storage side-car or a
          # shared PVC (see docs/kubernetes.md). Read-only root.
          volumeMounts:
            - name: media
              mountPath: /app/media
              readOnly: true
          securityContext:
            readOnlyRootFilesystem: false   # image layers are read-only; /app/media is the writable mount
      volumes:
        - name: media
          emptyDir: {}                      # placeholder — replace with PVC/object-storage in real clusters
