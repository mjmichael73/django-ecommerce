# Secret for sensitive values consumed by the web, worker and beat
# Deployments via `envFrom`. This file ships PLACEHOLDER values only (stringData
# style) — it is NOT a real credential set. Populate the real values in your
# cluster from your secret manager (e.g. kubectl create secret / sealed-secrets
# / External Secrets), never from this file.
#
# Secret-class env vars (anything key/secret/password/token), mirrored from
# .env.example: SECRET_KEY, POSTGRES_PASSWORD, STRIPE_*, GOOGLE_CLIENT_SECRET,
# SENTRY_* auth.
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  labels:
    app: ecommerce-web
type: Opaque
stringData:
  SECRET_KEY: "REPLACE-ME-via-cluster-secret-manager-not-committed"
  POSTGRES_PASSWORD: "REPLACE-ME-via-cluster-secret-manager-not-committed"
  STRIPE_PUBLISHABLE_KEY: "pk_test_PLACEHOLDER"
  STRIPE_SECRET_KEY: "sk_test_PLACEHOLDER_NOT_REAL"
  STRIPE_WEBHOOK_SECRET: "whsec_PLACEHOLDER_NOT_REAL"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  SENTRY_DSN: ""
  SENTRY_ENVIRONMENT: "production"
  SENTRY_RELEASE: ""
