{% extends "shop/base.html" %}

{% block title %}Password updated · Studio Market{% endblock %}

{% block content %}
<div class="page-head">
  <h1 class="page-head__title">Password updated</h1>
  <p class="page-head__crumb">You're all set</p>
</div>
<div class="auth-stack">
  <div class="order-form-panel auth-panel">
    <p class="auth-panel__meta">Your password has been changed. You can now log in with your new password.</p>
    <p class="auth-panel__footer"><a href="{% url 'accounts:login' %}">Log in</a></p>
  </div>
</div>
{% endblock %}
