services:
  # PostgreSQL is the shared instance from ~/projects/shared-services
  # (external network shared-services-network, database: ecommerce).
  # Bring it up first:  cd ~/projects/shared-services && docker compose up -d postgres
  # Redis is the shared instance from ~/projects/shared-services — same external network as
  # Postgres, no local service defined here. It hosts DB 1 for this app's Celery results and
  # DB 2 for the Django cache (rate limiting); DB 0 belongs to other projects.
  rabbitmq:
    image: rabbitmq:3.13.0-management-alpine
    restart: unless-stopped
    tty: true
    ports:
      - '5672:5672'
      - '15672:15672'
      - '15692:15692'
      - '25672:25672'
    networks:
      - ecommerce-net
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '8089:8000'
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required in .env - see .env.example}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env - see .env.example}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_CACHE_URL: redis://redis:6379/2
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      DJANGO_BEHIND_PROXY: ${DJANGO_BEHIND_PROXY:-}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-true}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CSP_REPORT_URI: ${CSP_REPORT_URI:-}
      # Optional CDN for static assets (card 327eeba2 — Phase 3.1 caching).
      # Leave STATIC_CDN_URL blank to serve static files via WhiteNoise from /static/.
      # Set it (e.g. https://cdn.example.com/) to route {% static %} URLs to a CDN.
      STATIC_CDN_URL: ${STATIC_CDN_URL:-}
      STATIC_CDN_MANIFEST: ${STATIC_CDN_MANIFEST:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-}
      PROMETHEUS_METRICS_ALLOWED_IPS: ${PROMETHEUS_METRICS_ALLOWED_IPS:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-}
      SENTRY_SCRUB_REQUEST_HEADERS: ${SENTRY_SCRUB_REQUEST_HEADERS:-}
      SENTRY_SCRUB_REQUEST_COOKIES: ${SENTRY_SCRUB_REQUEST_COOKIES:-}
      SENTRY_SCRUB_PAYMENT_DATA: ${SENTRY_SCRUB_PAYMENT_DATA:-}
      SENTRY_SENSITIVE_FIELDS: ${SENTRY_SENSITIVE_FIELDS:-}
      SENTRY_CELERY_ENABLED: ${SENTRY_CELERY_ENABLED:-}
      SENTRY_DJANGO_ENABLED: ${SENTRY_DJANGO_ENABLED:-}
      LOG_JSON: ${LOG_JSON:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      # Native Django persistent connections (card a8g83e7c).
      # Set to an integer number of seconds, e.g. 60, to reuse Postgres
      # connections across requests; leave empty for Django's default (close
      # per request). 0 explicitly disables reuse.
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-}
    volumes:
      - media_data:/app/media
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-net
      - shared-services-network

  reverse-proxy:
    profiles:
      - reverse-proxy
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
    networks:
      - ecommerce-net

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ['celery', '-A', 'ecommerce', 'worker', '-l', 'info']
    healthcheck:
      test: ['CMD-SHELL', 'celery -A ecommerce inspect ping -t 10']
      interval: 30s
      timeout: 15s
      retries: 4
      start_period: 90s
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required in .env - see .env.example}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env - see .env.example}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_CACHE_URL: redis://redis:6379/2
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      DJANGO_BEHIND_PROXY: ${DJANGO_BEHIND_PROXY:-}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-true}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      SKIP_COLLECTSTATIC: '1'
      STATIC_CDN_URL: ${STATIC_CDN_URL:-}
      STATIC_CDN_MANIFEST: ${STATIC_CDN_MANIFEST:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-}
      SENTRY_SCRUB_REQUEST_HEADERS: ${SENTRY_SCRUB_REQUEST_HEADERS:-}
      SENTRY_SCRUB_REQUEST_COOKIES: ${SENTRY_SCRUB_REQUEST_COOKIES:-}
      SENTRY_SCRUB_PAYMENT_DATA: ${SENTRY_SCRUB_PAYMENT_DATA:-}
      SENTRY_SENSITIVE_FIELDS: ${SENTRY_SENSITIVE_FIELDS:-}
      SENTRY_CELERY_ENABLED: ${SENTRY_CELERY_ENABLED:-}
      SENTRY_DJANGO_ENABLED: ${SENTRY_DJANGO_ENABLED:-}
      LOG_JSON: ${LOG_JSON:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      # Native Django persistent connections (card a8g83e7c).
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-}
    volumes:
      - media_data:/app/media
    depends_on:
      rabbitmq:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - ecommerce-net
      - shared-services-network

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Bypass entrypoint.sh (no migrate/collectstatic for a monitoring-only process).
    entrypoint: ['celery', '-A', 'ecommerce', 'flower', '--address=0.0.0.0', '--port=5555']
    ports:
      - '5555:5555'
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required in .env - see .env.example}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env - see .env.example}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_CACHE_URL: redis://redis:6379/2
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      DJANGO_BEHIND_PROXY: ${DJANGO_BEHIND_PROXY:-}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-true}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      STATIC_CDN_URL: ${STATIC_CDN_URL:-}
      STATIC_CDN_MANIFEST: ${STATIC_CDN_MANIFEST:-}
      LOG_JSON: ${LOG_JSON:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      # Native Django persistent connections (card a8g83e7c).
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
      celery-worker:
        condition: service_started
    networks:
      - ecommerce-net
      - shared-services-network

  # ---------------------------------------------------------------------------
  # Monitoring stack (card 3c3b2e3a — Phase 4.1: Grafana dashboards).
  # OPTIONAL: not started by default. Enable with:
  #   docker compose --profile monitoring up -d
  # Grafana dashboards and Prometheus config live under docker/{grafana,prometheus}.
  # ---------------------------------------------------------------------------

  prometheus:
    profiles:
      - monitoring
    image: prom/prometheus:v2.53.3
    restart: unless-stopped
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - ecommerce-net
    depends_on:
      web:
        condition: service_started

  grafana:
    profiles:
      - monitoring
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
    environment:
      # Grafana admin credentials are environment-configured. If unset, Grafana
      # uses its own ephemeral defaults (admin/admin) on first boot only.
      # Never hardcode real passwords here — use .env or the shared instance.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Disable anonymous auth so the dashboards aren't exposed without login.
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      # Auto-provision dashboards + datasources from the mounted volumes.
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_PATHS_DATA: /var/lib/grafana/data
    volumes:
      - grafana_data:/var/lib/grafana/data
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards/dashboards:ro
    networks:
      - ecommerce-net
    depends_on:
      prometheus:
        condition: service_started

volumes:
  media_data:
  prometheus_data:
  grafana_data:

networks:
  ecommerce-net:
    driver: bridge
  shared-services-network:
    external: true
    name: ${SHARED_NETWORK_NAME:-shared-services-network}
