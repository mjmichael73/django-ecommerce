# Reverse proxy → Gunicorn (see README: reverse-proxy profile).
# Terminate TLS in this file (listen 443 ssl) in production and keep Gunicorn on the internal network only.

upstream gunicorn {
    server web:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    # Uploaded product images are read from disk, never proxied to Gunicorn.
    # Requires /app/media (the shared media_data volume) mounted read-only here.
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Collected static (collectstatic in the web image); same mount requirement.
    # With STATIC_CDN_URL set, browsers fetch /static/ from the CDN instead, so
    # this stays as the local / no-CDN fallback (7d is fine either way: CDN-serving
    # uses content-hashed filenames, not this header).
    location /static/ {
        alias /app/static/;
        expires 7d;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_redirect off;
    }
}
